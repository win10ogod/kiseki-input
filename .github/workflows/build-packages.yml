name: Build and package

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows-x64, os: windows-2022}
          - {name: macOS-arm64, os: macos-14}
          - {name: macOS-x64, os: macos-15-intel}
          - {name: Linux-x64, os: ubuntu-22.04}
          - {name: Linux-arm64, os: ubuntu-22.04-arm}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux development and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxtst-dev libglib2.0-dev libgdk-pixbuf-2.0-dev dpkg-dev
      - name: Windows driver source
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Chaoses-Ib/IbInputSimulator
          ref: f162f9b53eeed44a7a5028b54dd40fec34e1535d
          path: dependencies/IbInputSimulator
      - name: Windows dependencies and NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install detours:x64-windows-static rapidjson:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: |
          options=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tags must be vMAJOR.MINOR.PATCH'; exit 2; }
            options+=("-DKISEKI_VERSION=$version")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            options+=(-A x64 "-DKISEKI_IBINPUTSIMULATOR_SOURCE=$GITHUB_WORKSPACE/dependencies/IbInputSimulator" "-DKISEKI_VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT")
          elif [[ "$RUNNER_OS" == macOS ]]; then
            options+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0)
          fi
          cmake -S . -B build "${options[@]}"
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure
          python3 -m unittest discover -s test/skills -v
      - name: Verify installed layout
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/kiseki installed"
          python3 scripts/verify_install.py "$RUNNER_TEMP/kiseki installed"
      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -C Release -B packages
          python3 scripts/verify_packages.py packages --installers
          python3 scripts/package_checksums.py packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.name }}
          path: |
            packages/*.exe
            packages/*.zip
            packages/*.pkg
            packages/*.deb
            packages/*.tar.gz
            packages/*.sha256
          if-no-files-found: error
      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/Testing/Temporary/
            packages/_CPack_Packages/**/CPack*.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package_checksums.py packages --verify
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Kiseki Input $RELEASE_TAG" --notes-file docs/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
